name: Vercel-Final-Workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # 1. BİLD VƏ TEST MƏRHƏLƏSİ
  Build-Process:
    name: 🏗️ Proyektin Hazırlanması
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Kodu Götür
        uses: actions/checkout@v4

      - name: 🛠️ Quruluş Yoxlanışı
        run: |
          echo "Build prosesi başlayır..."
          # Faylların tamlığını yoxlayırıq
          if [ -f "index.html" ]; then
            echo "index.html tapıldı, yoxlanış uğurludur."
          else
            echo "index.html tapılmadı!"
            exit 1
          fi

  # 2. DEPLOY MƏRHƏLƏSİ
  Deploy-Process:
    name: 🚀 Canlıya Çıxış (Vercel)
    needs: Build-Process # Yalnız Build uğurlu olsa işləsin
    runs-on: ubuntu-latest
    if: github.event_name == 'push' # Yalnız push olanda deploy et
    steps:
      - name: 📦 Kodu Götür
        uses: actions/checkout@v4

      - name: 🚀 Vercel-ə Yerləşdir
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.TEAM_ID }}
          vercel-project-id: ${{ secrets.PROJECT_ID }}
          vercel-args: '--prod'
